# Set by .w8s/pipeline/20-deploy.sh on every deploy.
image:
  repository: registry.w8s.cloud/w3t-web/w3t-web
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

service:
  port: 80

# The signup server's settings (server/README in the repo's README.md).
app:
  siteUrl: https://w3t.se
  # The webinar's join link (e.g. a Google Meet link). Server-side only:
  # it goes in confirmation emails, the calendar invite and
  # server/send-join-link.mjs, never on the public site. Empty until set.
  webinarJoinUrl: 
  notifyTo: info@w3t.se
  # Reminders to the webinar's Mailgun list (server/send-reminder.mjs),
  # through the Mailgun template "webinar-reminder". Each CronJob sends
  # only when its reminder is due (week: 6-8 days before the start, day:
  # 12-36 hours before), so firing again a year later sends nothing.
  # Cron fields are in timeZone. Webinar: Tuesday 8 December 2026, 15:00.
  reminders:
    enabled: true
    timeZone: Europe/Stockholm
    week: "0 10 1 12 *"   # Tuesday 1 December, 10:00
    day: "0 10 7 12 *"    # Monday 7 December, 10:00
  mailgun:
    domain: mg.w3t.se
    url: https://api.eu.mailgun.net
    # The Secret holding the API key under `api-key`; 20-deploy.sh writes
    # it from the pipeline secret mailgun-api-key. Missing, signups
    # answer 503 and the rest of the site works.
    apiKeySecret: w3t-web-mailgun
    # Set by 20-deploy.sh so a rotated key restarts the pods.
    apiKeyChecksum: ""

# Route through the hub's Gateway. w8s publishes these hostnames once the
# agent reports the route (w3t.se is a custom domain of the org).
# Never leave this empty with a route: a route without hostnames would
# match every host on the shared w8s-gateway, so the chart skips the
# HTTPRoute entirely when the list is empty.
httproute:
  hostnames:
    - w3t.se
    - www.w3t.se
  gatewayName: w8s-gateway
  gatewayNamespace: w8s-system

# Set by .w8s/pipeline/20-deploy.sh on every deploy.
image:
  repository: registry.w8s.cloud/w3t-web/w3t-web
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

service:
  port: 80

# Route through the hub's Gateway. w8s publishes these hostnames once the
# agent reports the route (w3t.se is a custom domain of the org).
# Never leave this empty with a route: a route without hostnames would
# match every host on the shared w8s-gateway, so the chart skips the
# HTTPRoute entirely when the list is empty.
httproute:
  hostnames:
    - w3t.se
    - www.w3t.se
  gatewayName: w8s-gateway
  gatewayNamespace: w8s-system

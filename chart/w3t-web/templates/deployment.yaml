apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "w3t-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "w3t-web.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "w3t-web.labels" . | nindent 8 }}
      {{- with .Values.app.mailgun.apiKeyChecksum }}
      annotations:
        w3t.se/mailgun-key-checksum: {{ . | quote }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: SITE_URL, value: {{ .Values.app.siteUrl | quote }} }
            - { name: NOTIFY_TO, value: {{ .Values.app.notifyTo | quote }} }
            - { name: WEBINAR_JOIN_URL, value: {{ .Values.app.webinarJoinUrl | quote }} }
            - { name: MAILGUN_DOMAIN, value: {{ .Values.app.mailgun.domain | quote }} }
            - { name: MAILGUN_URL, value: {{ .Values.app.mailgun.url | quote }} }
            - name: MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.mailgun.apiKeySecret }}
                  key: api-key
                  optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}

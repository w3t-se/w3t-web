# Node serves the built site and the webinar signup API (server/).
# One image on purpose: this hub assembles one image per pipeline.
from: node:22-alpine

copy:
  /artifacts/out/app: /app

workdir: /app
user: "1000"
env:
  NODE_ENV: production
  PORT: "8080"
  SITE_DIR: /app/public
  WEBINAR_FILE: /app/webinar.json
cmd: ["node", "server/index.mjs"]

expose: ["8080"]

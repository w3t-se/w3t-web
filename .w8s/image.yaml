# Static nginx with the site baked in at build time, same shape as the
# w8s docs-site. Unprivileged so it runs under Pod Security "restricted".
from: nginxinc/nginx-unprivileged:1.27-alpine

copy:
  /artifacts/out/usr/share/nginx/html: /usr/share/nginx/html
  /artifacts/out/etc/nginx/conf.d/default.conf: /etc/nginx/conf.d/default.conf

expose: ["8080"]
